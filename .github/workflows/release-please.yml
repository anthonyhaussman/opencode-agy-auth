name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Diff package.json version
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          previous=""
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            prev_pkg=$(git show HEAD~1:package.json 2>/dev/null || echo "{}")
            previous=$(node -p \
              "JSON.parse(require('fs').readFileSync(0,'utf8')).version" \
              <<<"$prev_pkg" || echo "")
          fi
          if [ -z "$previous" ] || [ "$current" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $previous -> $current"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged: $current"
          fi

  release-please:
    needs: check-version-change
    if: ${{ needs.check-version-change.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      prerelease: ${{ steps.release-please.outputs.prerelease }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-please
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:node-import
      - name: Publish (prerelease)
        if: ${{ needs.release-please.outputs.prerelease == 'true' }}
        run: npm publish --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish (stable latest)
        if: ${{ needs.release-please.outputs.prerelease != 'true' }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
